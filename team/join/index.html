<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>スマート片付け | スペース参加</title>
        <meta name="description" content="スマート片付けの共有スペース参加リンクです。アプリを開くか、ストアからダウンロードしてください。">
        <link rel="icon" type="image/svg+xml" href="/icon.svg">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&amp;family=Quicksand:wght@600;700&amp;display=swap" rel="stylesheet">
        <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --color-bg-primary: #0e0608;
        --color-bg-surface: #f0ece6;
        --color-gold-light: #f7d878;
        --color-gold-dark: #c9922a;
        --color-pink-light: #f0a0b8;
        --color-pink-dark: #c04870;
        --primary: var(--color-gold-dark);
        --secondary: var(--color-gold-light);
        --text: #0e0608;
        --text-light: #666;
        --card: rgba(240, 236, 230, 0.98);
        --bg: linear-gradient(135deg, #f5f2ee 0%, #f0ece6 50%, #e8e4de 100%);
      }

      body {
        font-family: 'Nunito', 'Hiragino Sans', 'Yu Gothic', sans-serif;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px 20px;
      }

      .card {
        width: min(520px, 100%);
        background: var(--card);
        border-radius: 24px;
        padding: 28px 24px 30px;
        box-shadow: 0 20px 60px rgba(14, 6, 8, 0.1), 0 8px 24px rgba(201, 146, 42, 0.08);
        border: 1px solid rgba(201, 146, 42, 0.2);
        text-align: center;
      }

      .logo {
        font-family: 'Quicksand', sans-serif;
        font-weight: 700;
        font-size: 1.6rem;
        color: var(--primary);
        letter-spacing: 0.02em;
        margin-bottom: 12px;
      }

      h1 {
        font-size: 1.5rem;
        line-height: 1.4;
        margin-bottom: 12px;
      }

      p {
        color: var(--text-light);
        line-height: 1.7;
        margin-bottom: 20px;
      }

      .details {
        background: rgba(247, 216, 120, 0.15);
        border-radius: 16px;
        padding: 14px 16px;
        margin-bottom: 20px;
        text-align: left;
        font-size: 0.95rem;
        border: 1px solid rgba(201, 146, 42, 0.15);
      }

      .details strong {
        color: var(--text);
      }

      .buttons {
        display: grid;
        gap: 12px;
        margin-bottom: 12px;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 12px 18px;
        border-radius: 999px;
        font-weight: 700;
        text-decoration: none;
        border: 1px solid transparent;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .button-primary {
        background: linear-gradient(135deg, var(--color-gold-light), var(--color-gold-dark));
        color: #111;
        box-shadow: 0 12px 28px rgba(201, 146, 42, 0.25);
      }

      .button-secondary {
        background: var(--card);
        color: var(--primary);
        border: 1px solid rgba(201, 146, 42, 0.35);
      }

      .button:hover {
        transform: translateY(-2px);
      }

      .note {
        font-size: 0.85rem;
        color: var(--text-light);
      }
        </style>
    </head>
    <body>
        <main class="card">
            <div class="logo">スマート片付け</div>
            <h1>スペース参加</h1>
            <p>このリンクからアプリが起動します。アプリが未インストールの場合はストアからダウンロードしてください。</p>
            <div class="details" id="details">
                <div>
                    <strong>スペース名:</strong>
                    <span id="team-id">-</span>
                </div>
            </div>
            <div class="buttons">
                <a class="button button-primary" id="open-app" href="#">アプリを開く</a>
                <a class="button button-secondary" href="https://apps.apple.com/jp/app/%E3%82%B9%E3%83%9E%E3%82%B9%E3%82%A4/id6756019486">App Storeでダウンロード</a>
                <a class="button button-secondary" href="https://play.google.com/store/apps/details?id=jp.smartswim.app">Google Playでダウンロード</a>
            </div>
            <div class="note">ヒント: アプリがインストール済みなら、通常は招待先のスペースが自動で開きます。</div>
        </main>
        <script>
      const params = new URLSearchParams(window.location.search);
      const teamName = params.get('teamName');
      const teamId = params.get('teamId');

      document.getElementById('team-id').textContent = teamName || teamId || '-';

      const iosUrl = `jp.smartswim.app://team/join?teamId=${encodeURIComponent(teamId)}`;
      const androidUrl =
        `intent://team/join?teamId=${encodeURIComponent(teamId)}` +
        `#Intent;scheme=jp.smartswim.app;package=jp.smartswim.app;end`;
      const isAndroid = /Android/i.test(navigator.userAgent);

      const openApp = document.getElementById('open-app');
      openApp.addEventListener('click', (e) => {
        e.preventDefault();
        window.location.href = isAndroid ? androidUrl : iosUrl;
      });
        </script>
    </body>
</html>
